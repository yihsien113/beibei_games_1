  <script>
    // 從關卡／衣櫥／貼紙簿返回，或上次是在第二大廳(魔法森林)離開且已解鎖時，直接導向 lobby1.html
    (function () {
      var isFromSubpageToLobby1 = sessionStorage.getItem('current_lobby') === 'lobby1' &&
          sessionStorage.getItem('returning_from_subpage') === '1';
      var isLastLobby1 = localStorage.getItem('last_lobby') === 'lobby1';
      var forestOpen = true;
      for (var i = 1; i <= 15; i++) {
        if (localStorage.getItem('map' + i + '_cleared') !== 'true') {
          forestOpen = false;
          break;
        }
      }
      if (forestOpen && (isFromSubpageToLobby1 || isLastLobby1)) {
        window.location.replace('lobby1.html');
      } else {
        sessionStorage.setItem('current_lobby', 'index');
      }
    })();
  </script>

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body { 
      width: 100%; 
      height: 100%;
      margin: 0; 
      padding: 0;
      overflow: hidden; 
      background-color: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(30, 30, 30, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(env(safe-area-inset-top), 12px) 20px 12px 20px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: z-index 0.1s; /* 教學模式升降層級用 */
    }

    #hud {
      color: #fff; 
      font-size: 26px; 
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      padding: 5px 15px;
      border-radius: 20px;
      background: rgba(0,0,0,0.3);
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    #quick-menu {
      display: flex;
      gap: 15px;
      align-items: center;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .btn-floating {
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      border: 3px solid #fff;
      border-radius: 50%;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.6);
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.3s ease, filter 0.3s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-floating:active {
      transform: scale(0.85);
      box-shadow: 0 2px 6px rgba(255, 105, 180, 0.5);
    }

    /* 🌟 教學模式用的樣式與動畫 🌟 */
    .tutorial-highlight { 
      pointer-events: none !important; 
    }
    .dimmed { 
      opacity: 0.25 !important; 
      filter: grayscale(80%) brightness(0.5); 
      pointer-events: none; 
    }
    @keyframes finger-bounce-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #reward-modal {
      position: fixed;
      inset: 0;
      z-index: 1000; 
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px); 
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #reward-modal.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10000;
    }

    #reward-modal-content {
      background-color: #1e293b;
      border-radius: 3rem;       
      padding: 2.5rem 1.8rem 2rem 1.8rem;
      max-width: 560px;
      width: 90%;
      margin: 0 16px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);

      transform: scale(0.9);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #reward-modal.active #reward-modal-content {
      transform: scale(1);
    }

    #reward-badge {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);

      color: #ffffff;
      padding: 8px 28px;
      border-radius: 9999px;

      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      border: 4px solid #ffffff;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 260px;
    }

    #reward-img-box {
      position: relative;
      width: clamp(180px, 45vw, 240px);
      height: clamp(180px, 45vw, 240px);
      margin: 20px auto 20px auto;
      background-color: #334155; 
      border-radius: 2.5rem;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 8px solid #475569; 
    }

    #reward-bg-ray {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(253, 230, 138, 0.55) 0%, rgba(253, 230, 138, 0) 70%);
      animation: pulse-ray 2s infinite ease-in-out;
    }

    @keyframes pulse-ray {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    #reward-img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      position: relative;
      z-index: 10;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
    }

    #reward-coin-icon {
      font-size: clamp(90px, 22vw, 130px);
      position: relative;
      z-index: 10;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
      display: none;
    }

    #reward-info-box {
      background-color: #334155; 
      border-radius: 1.5rem;
      padding: 18px 20px;
      margin-bottom: 20px;
      border: 2px solid #64748b;

    }

    #reward-title {

    }

    #btn-claim-reward {

      background-color: #10b981; 
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(24px, 5.5vw, 32px);
      padding: 16px 24px;
      border-radius: 1.25rem;
      border: 4px solid #a7f3d0;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);

      align-items: center;
      justify-content: center;

    }

    }

    }

    #reward-modal .char-block { margin-right: 0.6em; margin-bottom: 6px; }

    /* 🌟 版本號碼顯示樣式 🌟 */
    #version-display {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.4);

      border-radius: 12px;

    }

    }

  
    #update-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;

    #update-modal.active {

    #update-modal-content {
      background-color: #1e293b;

      margin: 0 16px;

    .update-title {

    #btn-close-update {

      padding: 12px;

    }

    /* ☁️ 帳號登入按鈕與彈窗樣式 (無注音、清晰介面) ☁️ */

    #auth-status-msg, #logged-status-msg {

    .auth-btn-row {

    }
    .btn-auth {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 18px;

      color: #fff;

      border: 2px solid transparent;
      transition: transform 0.1s ease, opacity 0.15s ease;
      touch-action: manipulation;
    }
    .btn-auth:active { transform: scale(0.95); }
    .btn-auth:disabled { opacity: 0.5; pointer-events: none; }
    .btn-auth-login {
      background-color: #2563eb;
      border-color: #93c5fd;
    }
    .btn-auth-register {
      background-color: #10b981;

    }
    .btn-auth-skip {
      width: 100%;
      background-color: #334155;

      touch-action: manipulation;
    }
    .btn-auth-skip:active { transform: scale(0.96); }
    .logged-account-box {
      background: #0f172a;
      border: 2px solid #475569;

      padding: 14px;

      color: #fde68a;
    }
    .confirm-account-box {

      font-weight: 900;
      color: #fde68a;
      word-break: break-all;
    }
    #confirm-status-msg {

    .btn-confirm-o {

      border-color: #fca5a5;
      font-size: 28px;
      font-weight: 900;
      padding: 14px;
    }

<body>
  <div id="preloader" style="position:fixed;inset:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:sans-serif;color:#fff;">
    <div style="font-size:22px;margin-bottom:20px;font-weight:bold;">遊戲素材載入中...</div>
    <div style="width:300px;height:18px;background:#333;border-radius:9px;overflow:hidden;border:2px solid #555;">
      <div id="progress-bar" style="width:0%;height:100%;background:#4caf50;transition:width 0.1s ease;"></div>
    </div>
    <div id="progress-text" style="margin-top:12px;font-size:16px;color:#bbb;">0% (0 / 0)</div>
    <div id="loading-file" style="margin-top:8px;font-size:13px;color:#888;max-width:85vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">準備檢查檔案...</div>
    <div id="loading-speed" style="margin-top:4px;font-size:13px;color:#4caf50;height:18px;"></div>
  </div>

  <!-- 🌟 第一次遊玩的教學開始畫面 -->
  <div id="tutorial-start-screen" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white;">
    <h1 class="zh-text" style="font-size: 40px; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.8);">
      <ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>開<rt>ㄎㄞ</rt></ruby><ruby>啟<rt>ㄑㄧˇ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby><ruby>量<rt>ㄌㄧㄤˋ</rt></ruby> 🔊
    </h1>
    <button id="btn-start-tutorial" onclick="startLobbyTutorial()" style="padding: 15px 40px; font-size: 32px; font-weight: bold; background: #ff4081; color: white; border: 4px solid #fff; border-radius: 35px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 64, 129, 0.6); display: flex; align-items: center; gap: 10px;">
      <span class="zh-text"><ruby>開<rt>ㄎㄞ</rt></ruby><ruby>始<rt>ㄕˇ</rt></ruby><ruby>遊<rt>ㄧㄡˊ</rt></ruby><ruby>玩<rt>ㄨㄢˊ</rt></ruby></span>
    </button>
  </div>

  <!-- 🌟 DOM 教學的高光遮罩 -->
  <div id="dom-tutorial-overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9000; display:none; pointer-events:none; transition: opacity 0.3s ease;"></div>
  
  <!-- 🌟 DOM 教學的手指 (改為由下往上指) -->
  <div id="dom-tutorial-finger" style="position:fixed; font-size:60px; z-index:9002; display:none; pointer-events:none; animation: finger-bounce-y 1s infinite; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">👆</div>

  <div id="top-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div id="hud"> ⭐ <span id="coinDisplay">0</span></div>
  
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px;">
        <div id="version-display" onclick="showUpdateNotice()"></div>
        <div id="account-btn" onclick="openAccountModal(false)">👤 帳號登入</div>
      </div>
    </div>
    
    <div id="quick-menu">
      <div id="btn-wardrobe" class="btn-floating" onclick="goToWardrobe()">👗</div>
      <div id="btn-sticker" class="btn-floating" onclick="goToStickerBook()">📖</div>
    </div>
  </div>

  <!-- ☁️ 帳號登入 / 註冊彈出視窗 (無注音) -->
  <div id="account-modal">
    <div id="account-modal-content">
      <!-- 未登入視圖：登入 / 註冊 / 不註冊直接遊玩 -->
      <div id="auth-form-view" style="display: flex; flex-direction: column; gap: 14px;">
        <h2 class="account-modal-title">☁️ 帳號雲端存檔</h2>
        <p class="account-modal-desc">登入或註冊帳號，讓手機與平板自動同步遊戲進度</p>
        <div class="account-input-group">
          <input type="text" id="auth-account-input" placeholder="請輸入帳號（中英文皆可）" autocomplete="username">
          <input type="password" id="auth-password-input" placeholder="請輸入密碼" autocomplete="current-password">
        </div>
        <div id="auth-status-msg"></div>
        <div class="auth-btn-row">
          <button id="btn-auth-login" class="btn-auth btn-auth-login" onclick="handleAuthSubmit('login')">登入</button>
          <button id="btn-auth-register" class="btn-auth btn-auth-register" onclick="handleAuthSubmit('register')">註冊</button>
        </div>
        <button id="btn-auth-skip" class="btn-auth-skip" onclick="handleSkipAuth()">不註冊直接遊玩</button>
      </div>

      <!-- 已登入視圖：查看帳號 / 手動同步 / 切換帳號 -->
      <div id="auth-logged-view" style="display: none; flex-direction: column; gap: 14px;">
        <h2 class="account-modal-title">☁️ 雲端帳號管理</h2>
        <div class="logged-account-box" id="logged-account-display">目前帳號：</div>
        <div id="logged-status-msg">進度會在過關與獲得獎勵時自動同步</div>
        <div class="auth-btn-row">
          <button id="btn-manual-sync" class="btn-auth btn-auth-login" onclick="handleManualSync()">立即同步</button>
          <button class="btn-auth" style="background-color: #ef4444; border-color: #fca5a5;" onclick="handleLogoutAccount()">切換帳號</button>
        </div>

  <script>
    let isPreloading = false;
    let swControllerChanged = false;
    let swRegistration = null;

    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (isPreloading) {
          swControllerChanged = true;
          return;
        }
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then((reg) => {
          swRegistration = reg;
          console.log('Service Worker 註冊成功');
          reg.update();
        })
        .catch((err) => console.warn('Service Worker 註冊失敗:', err));
    }

    // 🌟 優化 1：啟動時自動確認版本、清除舊快取，並分批載入 (每次最多 5 個檔案)
    async function runPreloader() {
      isPreloading = true;
      const bar = document.getElementById('progress-bar');
      const text = document.getElementById('progress-text');
      const loadingFileEl = document.getElementById('loading-file');
      const preloader = document.getElementById('preloader');

      let cacheName = typeof CACHE_NAME !== 'undefined' ? CACHE_NAME : (typeof GAME_CACHE_NAME !== 'undefined' ? GAME_CACHE_NAME : 'game-cache');
      let assetsList = typeof GAME_ASSETS !== 'undefined' ? GAME_ASSETS : [];
      let hadOldCache = false;
      let serverManifestUpdated = false;

      // 有網路時主動向伺服器確認最新版清單（繞過 iOS / iPadOS HTTP 快取）
      if (navigator.onLine) {
        try {
          if (loadingFileEl) loadingFileEl.innerText = '正在確認最新版本...';
          const manifestRes = await fetch('assets-manifest.js?t=' + Date.now(), { cache: 'no-store' });
          if (manifestRes.ok) {
            const manifestText = await manifestRes.text();
            const parsed = new Function(
              manifestText + '\nreturn { cacheName: typeof CACHE_NAME !== "undefined" ? CACHE_NAME : "", assetsList: typeof GAME_ASSETS !== "undefined" ? GAME_ASSETS : [] };'
            )();
            if (parsed.cacheName) {
              if (parsed.cacheName !== cacheName) {
                serverManifestUpdated = true;
              }
              cacheName = parsed.cacheName;
            }
            if (Array.isArray(parsed.assetsList) && parsed.assetsList.length > 0) {
              assetsList = parsed.assetsList;
            }
          }
        } catch (err) {
          console.warn('版本確認略過（離線或連線異常）:', err);
        }
      }

      if ('caches' in window) {
        // 清理與最新版本不符的舊快取（不影響 localStorage 遊戲進度）
        try {
          const keys = await caches.keys();
          for (const key of keys) {
            if (key !== cacheName) {
              await caches.delete(key);
              hadOldCache = true;
            }
          }
        } catch (err) {
          console.warn('清理舊快取失敗:', err);
        }

        if (hadOldCache && swRegistration) {
          swRegistration.update().catch(() => {});
        }

        if (assetsList.length > 0) {
          const cache = await caches.open(cacheName);
          let loadedCount = 0;
          const total = assetsList.length;
          const batchSize = 5; // 每次最多同時處理 5 個請求

          for (let i = 0; i < total; i += batchSize) {
            const batch = assetsList.slice(i, i + batchSize);
            await Promise.all(batch.map(async (url) => {
              try {
                const match = await cache.match(url);
                if (!match) {
                  if (loadingFileEl) loadingFileEl.innerText = `載入中：${url}`;
                  const res = await fetch(url, { cache: 'reload' });
                  if (res.ok) await cache.put(url, res);
                }
              } catch (err) {
                console.warn('預載失敗:', url);
              } finally {
                loadedCount++;
                const percent = Math.round((loadedCount / total) * 100);
                if (bar) bar.style.width = percent + '%';
                if (text) text.innerText = `${percent}% (${loadedCount} / ${total})`;
              }
            }));
          }
        }
      }

      isPreloading = false;

      // 若偵測到版本更新或 SW 切換，重整一次以確保執行新版 index.html，再進行雲端同步
      const reloadFlagKey = 'reloaded_for_' + cacheName;
      const needsReload = (hadOldCache || serverManifestUpdated || swControllerChanged) && !sessionStorage.getItem(reloadFlagKey);
      if (needsReload && navigator.onLine) {
        sessionStorage.setItem(reloadFlagKey, '1');
        if (loadingFileEl) loadingFileEl.innerText = '已更新至最新版本，正在重新啟動...';
        window.location.reload();
        return;
      }

      setTimeout(() => {
        if (preloader) {
          preloader.style.transition = 'opacity 0.5s ease';
          preloader.style.opacity = '0';
          setTimeout(() => {
            preloader.remove();
            initCloudAndStartLobby();
          }, 500);
        } else {
          initCloudAndStartLobby();
        }
      }, 200);
    }

    window.addEventListener('DOMContentLoaded', runPreloader);
  </script>

      function convertRuby(rubyElement) {
        const charText = Array.from(rubyElement.childNodes)
          .filter(node => node.nodeType === Node.TEXT_NODE)
          .map(node => node.textContent).join('').trim();
        const rt = rubyElement.querySelector('rt');
        if (!rt) return;
        let bopoText = rt.textContent.trim();
        let tone = '';
        let bopoBase = bopoText;
        const normalTones = ['ˊ', 'ˇ', 'ˋ'];
        if (bopoText.includes('˙')) {
          tone = '˙';
          bopoBase = bopoText.replace(/˙/g, '');
        } else if (normalTones.includes(bopoText.slice(-1))) {
          tone = bopoText.slice(-1);
          bopoBase = bopoText.slice(0, -1);
        }
        const charBlock = document.createElement('span');
        charBlock.className = 'char-block';
        const charSpan = document.createElement('span');
        charSpan.textContent = charText;
        charBlock.appendChild(charSpan);
        const bopoSpan = document.createElement('span');
        bopoSpan.className = 'bopo';
        bopoSpan.textContent = bopoBase;
        if (tone) {
          const toneSpan = document.createElement('span');
          toneSpan.className = tone === '˙' ? 'tone sp' : 'tone';
          toneSpan.textContent = tone;
          bopoSpan.appendChild(toneSpan);
        }
        charBlock.appendChild(bopoSpan);
        rubyElement.replaceWith(charBlock);
      }

      function renderAll() {
        document.querySelectorAll('ruby').forEach(convertRuby);
      }
      window.Bopomofo = { render: renderAll, convert: convertRuby };
    })();

      if (typeof zones !== 'undefined') {
        // 雲端同步後若位置不同(例如換裝置登入)，把人偶移到雲端記錄的位置
        if (!player.isMoving) {
          const sx = parseFloat(localStorage.getItem('lobbyPlayerX'));
          const sy = parseFloat(localStorage.getItem('lobbyPlayerY'));
          if (!isNaN(sx) && !isNaN(sy) && (Math.abs(sx - player.x) > 1 || Math.abs(sy - player.y) > 1)) {
            player.x = player.targetX = sx;
            player.y = player.targetY = sy;
            cameraX = player.x - (canvas.width / scale) / 2;
            cameraY = player.y - (canvas.height / scale) / 2;
            clampCamera();
          }
        }
        for (let z of zones) {
          if (z.imgSrc && isLevelCleared(z) && !z.img) {
            z.img = new Image();
            z.img.src = z.imgSrc;
          }

    window.addEventListener('cloudsync:updated', refreshLobbyFromStorage);

      if (document.visibilityState === 'visible' && window.CloudSync && window.CloudSync.getAccount()) {

    async function initCloudAndStartLobby() {

      updateAccountButtonLabel();

      const isReturningFromSubpage = sessionStorage.getItem('returning_from_subpage') === '1';
      sessionStorage.removeItem('returning_from_subpage');

      if (!window.CloudSync) {
        checkUpdateAndTutorial();
        return;
      }

      const acc = window.CloudSync.getAccount();
      if (acc) {
        if (isReturningFromSubpage) {
          // 從關卡／衣櫥／貼紙簿返回大廳：直接背景同步（最多等待 1.2 秒），不再重複詢問
          await Promise.race([
            window.CloudSync.syncNow(false),
            new Promise(r => setTimeout(r, 1200))

    function startLobbyTutorial() {

    function highlightDOM(elementId) {
      document.getElementById('dom-tutorial-overlay').style.display = 'block';
      document.getElementById('top-bar').style.zIndex = '9001'; 
      
      document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
      document.querySelectorAll('.dimmed').forEach(el => el.classList.remove('dimmed'));
      
      let target = document.getElementById(elementId);
      if (target) {
        target.classList.add('tutorial-highlight');
        
        if (elementId === 'hud') {
          document.getElementById('quick-menu').classList.add('dimmed');
        } else if (elementId === 'btn-wardrobe') {
          document.getElementById('hud').classList.add('dimmed');
          document.getElementById('btn-sticker').classList.add('dimmed');
        } else if (elementId === 'btn-sticker') {
          document.getElementById('hud').classList.add('dimmed');
          document.getElementById('btn-wardrobe').classList.add('dimmed');
        }

        let rect = target.getBoundingClientRect();
        let finger = document.getElementById('dom-tutorial-finger');
        finger.style.display = 'block';
        
        finger.innerHTML = '👆';
        finger.style.left = (rect.left + rect.width / 2 - 30) + 'px'; 
        finger.style.top = (rect.bottom + 15) + 'px'; 
      }
    }

    function endLobbyTutorial() {
      isTutorialMode = false;
      lobbyTutorialStep = -1;
      document.getElementById('dom-tutorial-overlay').style.display = 'none';
      document.getElementById('dom-tutorial-finger').style.display = 'none';
      
      document.getElementById('top-bar').style.zIndex = ''; 
      document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
      document.querySelectorAll('.dimmed').forEach(el => el.classList.remove('dimmed'));
      
      localStorage.setItem('lobby_tutorial_done', 'true');
    }

    function handleLobbyDialogClick() {
      if (window.RPGDialog && window.RPGDialog.boxElement.style.display === 'block') {
        if (!window.RPGDialog.isLocked()) {
          window.RPGDialog.hide();
          
          if ([0, 1, 2, 5, 7, 8, 9].includes(lobbyTutorialStep)) {
            nextTutorialStep();
          }
        }
        return true; 
      }
      return false;
    }

    const starCache = document.createElement('canvas');
    const starSize = 200; 
    starCache.width = starSize;
    starCache.height = starSize;
    const sCtx = starCache.getContext('2d');
    if (sCtx) { 
      sCtx.font = '120px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
      sCtx.textAlign = 'center';
      sCtx.textBaseline = 'middle';
      sCtx.shadowColor = 'rgba(255, 235, 59, 0.95)';
      sCtx.shadowBlur = 25; 
      sCtx.fillText('🌟', starSize / 2, starSize / 2);
    }

    const MAP_WIDTH = 3000;
    const MAP_HEIGHT = 4000;

    let scale = 1.0;
    let minScale = 1.0; 
    let cameraX = 0;
    let cameraY = 0;

    function clampCamera() {
      let viewW = canvas.width / scale;
      let viewH = canvas.height / scale;

      if (viewW > MAP_WIDTH) {
        cameraX = -(viewW - MAP_WIDTH) / 2;
      } else {
        cameraX = Math.max(0, Math.min(cameraX, MAP_WIDTH - viewW));
      }

      if (viewH > MAP_HEIGHT) {
        cameraY = -(viewH - MAP_HEIGHT) / 2;
      } else {
        // 允許地圖往下拉,讓最上方不被頂部列遮住
        const barEl = document.getElementById('top-bar');
        const topInset = barEl ? barEl.offsetHeight / scale : 0;
        cameraY = Math.max(-topInset, Math.min(cameraY, MAP_HEIGHT - viewH));
      }
    }

    function resize() {
      if (isExitingLobby) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      minScale = canvas.width / (MAP_WIDTH / 2);
      
      if (!isTutorialMode && scale < minScale) {
        scale = minScale;
      }
      clampCamera();
    }
    window.addEventListener('resize', resize);

    // 🌟 優化 2：離開大廳前往其他頁面時，徹底釋放所有大廳圖片與畫布記憶體
    function cleanupLobbyMemory() {
      if (isExitingLobby) return;
      isExitingLobby = true;

      // 1. 停止動畫迴圈
      if (lobbyAnimId) {
        cancelAnimationFrame(lobbyAnimId);
        lobbyAnimId = null;
      }

      // 2. 釋放超大背景圖、人物圖與關卡預覽圖
      if (bgImg) { bgImg.onload = null; bgImg.onerror = null; bgImg.src = ''; }
      if (playerImg) { playerImg.onload = null; playerImg.onerror = null; playerImg.src = ''; }
      if (typeof zones !== 'undefined') {
        for (let z of zones) {
          if (z.img) {
            z.img.onload = null;
            z.img.onerror = null;
            z.img.src = '';
            z.img = null;
          }
        }
      }

      // 3. 釋放離屏畫布快取 (starCache & portalGradCache)
      if (starCache) {
        if (sCtx) sCtx.clearRect(0, 0, starCache.width, starCache.height);
        starCache.width = 1;
        starCache.height = 1;
      }
      if (window.portalGradCache && window.portalGradCache !== 'fallback') {
        let pCtx = window.portalGradCache.getContext('2d');
        if (pCtx) pCtx.clearRect(0, 0, window.portalGradCache.width, window.portalGradCache.height);
        window.portalGradCache.width = 1;
        window.portalGradCache.height = 1;
        window.portalGradCache = null;
      }

      // 4. 釋放主畫布 GPU 記憶體
      if (canvas && ctx) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.width = 1;
        canvas.height = 1;
      }
    }

      { id: 'star10', type: '金幣', x: 0, y: 0, w: 225, h: 300, starX: 2766, starY: 3745, rewardAmount: 15 },
      { id: 'star11', type: '金幣', x: 0, y: 0, w: 225, h: 300, starX: 1894, starY: 3903, rewardAmount: 10 },
      { id: 'star12', type: '金幣', x: 0, y: 0, w: 225, h: 300, starX: 2519, starY: 3908, rewardAmount: 5 }
    ];

    // 🌟 小優化：只預載「已經破關」的關卡預覽圖，還沒破關的只顯示星星，不浪費記憶體載入圖片
    for (let z of zones) {
      if (z.imgSrc && isLevelCleared(z)) {
        z.img = new Image();
        z.img.src = z.imgSrc;
      }
    }

    // 🌲 魔法森林傳送門：map1 ~ map15 全部通關後，在 (654,1610) 出現橢圓傳送門，通往第二大廳 lobby1.html
    // 傳送門輪廓：lobby.webp (1200x1600) 的像素座標，× 2.5 轉成世界座標 (3000x4000)
    const FOREST_PORTAL = makeEllipsePortal([
      { x: 264, y: 677 }, { x: 255, y: 685 }, { x: 240, y: 661 }, { x: 240, y: 648 },
      { x: 251, y: 632 }, { x: 265, y: 628 }, { x: 276, y: 634 }, { x: 285, y: 646 },
      { x: 287, y: 659 }, { x: 285, y: 673 }, { x: 278, y: 680 }
    ], 2.5, 'lobby1.html');

    // 依多邊形點建立傳送門 (平滑封閉曲線 + 範圍 + 中心)
    function makeEllipsePortal(pixelPts, k, targetUrl) {
      const pts = pixelPts.map(p => ({ x: p.x * k, y: p.y * k }));
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of pts) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      }
      return { pts, minX, minY, maxX, maxY, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2,
               rx: (maxX - minX) / 2, ry: (maxY - minY) / 2, targetUrl };
    }

    function portalPath(c, pts) {
      const n = pts.length;
      c.beginPath();
      const m0 = { x: (pts[n - 1].x + pts[0].x) / 2, y: (pts[n - 1].y + pts[0].y) / 2 };
      c.moveTo(m0.x, m0.y);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        c.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
      }
      c.closePath();
    }

    function pointInPolygon(x, y, pts) {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }

    // 楓之谷風格傳送門：整個發光、看不見裡面
    function drawGlowPortal(c, p, time) {
      const t = time / 1000;
      const pulse = 0.85 + Math.sin(t * 3) * 0.15;
      c.save();
      // 外圍光暈
      portalPath(c, p.pts);
      c.shadowColor = 'rgba(140, 255, 220, ' + pulse + ')';
      c.shadowBlur = 70;
      c.fillStyle = '#d8fff4';
      c.fill();
      c.shadowBlur = 0;

      // 不透明的發光核心 (中心近白、邊緣偏青綠)
      portalPath(c, p.pts);
      c.clip();
      const g = c.createRadialGradient(p.cx, p.cy, 0, p.cx, p.cy, Math.max(p.rx, p.ry) * 1.1);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.5, '#c8fff0');
      g.addColorStop(1, '#5fe8c0');
      c.fillStyle = g;
      c.fillRect(p.minX - 20, p.minY - 20, p.maxX - p.minX + 40, p.maxY - p.minY + 40);

      // 旋轉的光紋
      c.globalCompositeOperation = 'lighter';
      c.translate(p.cx, p.cy);
      c.lineCap = 'round';
      for (let i = 0; i < 5; i++) {
        const a0 = t * 1.6 + i * (Math.PI * 2 / 5);
        c.beginPath();
        c.ellipse(0, 0, p.rx * (0.35 + 0.12 * i), p.ry * (0.35 + 0.12 * i), 0, a0, a0 + 1.2);
        c.strokeStyle = 'rgba(255,255,255,' + (0.55 + 0.3 * Math.sin(t * 2 + i)) + ')';
        c.lineWidth = 8;
        c.stroke();
      }
      // 上下飄動的光點
      for (let i = 0; i < 7; i++) {
        const ph = (t * 0.5 + i / 7) % 1;
        const px = Math.sin(i * 12.9 + t) * p.rx * 0.6;
        const py = p.ry * (0.9 - ph * 1.8);
        c.beginPath();
        c.arc(px, py, 6 + 4 * (1 - ph), 0, Math.PI * 2);
        c.fillStyle = 'rgba(255,255,255,' + (1 - ph) + ')';
        c.fill();
      }
      c.restore();

      // 發亮邊框
      c.save();
      portalPath(c, p.pts);
      c.strokeStyle = 'rgba(255,255,255,0.95)';
      c.lineWidth = 6;
      c.shadowColor = '#7dffd8';
      c.shadowBlur = 30;
      c.stroke();
      c.restore();
    }

    function isForestPortalOpen() {
      for (let i = 1; i <= 15; i++) {
        if (localStorage.getItem('map' + i + '_cleared') !== 'true') return false;
      }
      return true;
    }

    function isInForestPortal() {
      return pointInPolygon(player.x, player.y, FOREST_PORTAL.pts);
    }

    function enterForestPortal() {
      // 傳回大廳時，站在傳送門下方一點，避免立刻再次觸發；先更新 player 座標，避免 cleanupLobbyAndGo/pagehide 內的 savePlayerPosition() 覆寫成傳送門內座標
      player.x = Math.round(FOREST_PORTAL.cx);
      player.y = Math.round(FOREST_PORTAL.maxY + 80);
      localStorage.setItem('lobbyPlayerX', player.x);
      localStorage.setItem('lobbyPlayerY', player.y);
      localStorage.setItem('last_lobby', 'lobby1');
      sessionStorage.setItem('current_lobby', 'lobby1');
      cleanupLobbyAndGo(FOREST_PORTAL.targetUrl);
    }

    function drawForestPortal(time) {
      if (!isForestPortalOpen()) return;
      const p = FOREST_PORTAL;
      if (p.maxX < cameraX - 60 || p.minX > cameraX + canvas.width / scale + 60 ||
          p.maxY < cameraY - 60 || p.minY > cameraY + canvas.height / scale + 60) return;
      drawGlowPortal(ctx, p, time);
    }

    function isZoneClaimed(z) {
      return localStorage.getItem('blindbox_' + z.id) === 'claimed';
    }

    function isLevelCleared(z) {
      const key = z.clearKey || (z.id + '_cleared');
      return localStorage.getItem(key) === 'true';
    }

    let isModalOpen = false;
    let activeRewardZone = null;

    const rewardModal = document.getElementById('reward-modal');
    const rewardBadge = document.getElementById('reward-badge');
    const rewardImg = document.getElementById('reward-img');
    const rewardCoinIcon = document.getElementById('reward-coin-icon');
    const rewardTitle = document.getElementById('reward-title');

    function openRewardModal(zone) {
      isModalOpen = true;
      activeRewardZone = zone;
      player.isMoving = false; 

      if (zone.type === '貼紙') {
        rewardBadge.innerHTML = `<span class="zh-text"><ruby>貼<rt>ㄊㄧㄝ</rt></ruby><ruby>紙<rt>ㄓˇ</rt></ruby></span>`;
        rewardImg.src = zone.stickerSrc || '';
        rewardImg.style.display = 'block';
        rewardCoinIcon.style.display = 'none';
        rewardTitle.innerHTML = zone.stickerName || '';
      } else if (zone.type === '金幣') {
        rewardBadge.innerHTML = `<span class="zh-text"><ruby>星<rt>ㄒㄧㄥ</rt></ruby><ruby>星<rt>ㄒㄧㄥ</rt></ruby></span>`;
        rewardImg.style.display = 'none';
        rewardCoinIcon.style.display = 'block';
        rewardTitle.innerHTML = `⭐ + ${zone.rewardAmount || 0}`;
      }

      if (window.Bopomofo) window.Bopomofo.render();
      rewardModal.classList.add('active');
    }

    function closeRewardModal() {
      rewardModal.classList.remove('active');
      isModalOpen = false;
      activeRewardZone = null;

      if (isTutorialMode && lobbyTutorialStep === 6) {
        setTimeout(() => {
          nextTutorialStep(); 
        }, 300);
      }
    }

    function claimCurrentReward() {
      if (!activeRewardZone) return;
      const z = activeRewardZone;

      if (z.type === '貼紙') {
        if (z.stickerId) {
          const currentStatus = localStorage.getItem('sticker_' + z.stickerId);
          if (currentStatus !== 'true') {
            localStorage.setItem('sticker_' + z.stickerId, 'new');
          }
        }
        localStorage.setItem('blindbox_' + z.id, 'claimed');
      } else if (z.type === '金幣') {
        const addAmount = parseInt(z.rewardAmount || 0, 10);
        playerCoins += addAmount;
        localStorage.setItem('playerCoins', playerCoins);
        document.getElementById('coinDisplay').innerText = playerCoins;
        localStorage.setItem('blindbox_' + z.id, 'claimed');
      }

      closeRewardModal();
    }

    let lastTime = performance.now();
    function gameLoop(currentTime) {
      if (isExitingLobby) return;
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      update(Math.min(dt, 0.1));
      draw(currentTime); 
      lobbyAnimId = requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      if (isTutorialMode) {
        let targetCamX = player.x - (canvas.width / scale) / 2;
        let targetCamY = player.y - (canvas.height / scale) / 2;
        cameraX += (targetCamX - cameraX) * 0.1;
        cameraY += (targetCamY - cameraY) * 0.1;
        clampCamera();
      }

      if (isModalOpen) return; 

      if (player.isMoving) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let moveDist = player.speed * dt;

        if (distance > moveDist) {
          player.x += (dx / distance) * moveDist;
          player.y += (dy / distance) * moveDist;
          player.walkCycle += 20 * dt;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
          player.isMoving = false;
          player.walkCycle = 0;
          savePlayerPosition();
          checkZones();

          if (isTutorialMode) {
            if (lobbyTutorialStep === 3) {
              nextTutorialStep(); 
            } else if (lobbyTutorialStep === 4) {
              nextTutorialStep(); 
            }
          }
        }
      }
    }

    function checkZones() {
      if (isModalOpen || isExitingLobby) return;

      if (!isTutorialMode && isForestPortalOpen() && isInForestPortal()) {
        savePlayerPosition();
        enterForestPortal();
        return;
      }

      for (let z of zones) {
        let isPortal = (z.type === '關卡' && isLevelCleared(z));
        let isHit = false;

        if (isPortal) {
          isHit = (player.x > z.x && player.x < z.x + z.w && 
                   player.y > z.y && player.y < z.y + z.h);
        } else {
          let sx = (z.starX !== undefined) ? z.starX : (z.x + z.w / 2);
          let sy = (z.starY !== undefined) ? z.starY : (z.y + z.h / 2);
          let starHitSize = 150; 
          let half = starHitSize / 2;
          isHit = (player.x > sx - half && player.x < sx + half && 
                   player.y > sy - half && player.y < sy + half);
        }

        if (isHit) {
          if (z.type === '關卡') {
            // 🌟 踩進關卡傳送門時，先釋放整個大廳的記憶體再跳轉
            cleanupLobbyAndGo(z.targetUrl || (z.id + '.html'));
            return;
          } 
          else if (z.type === '貼紙' || z.type === '金幣') {
            if (isZoneClaimed(z)) continue; 
            savePlayerPosition();
            openRewardModal(z);
            return;
          }
        }
      }
    }

    function draw(time) {
      if (isExitingLobby) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(scale, scale);
      ctx.translate(-cameraX, -cameraY);

      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, MAP_WIDTH, MAP_HEIGHT);
      } else {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
      }

      let viewW = canvas.width / scale;
      let viewH = canvas.height / scale;

      for (let z of zones) {
        if ((z.type === '貼紙' || z.type === '金幣') && isZoneClaimed(z)) {
          continue;
        }

        if (z.type === '關卡' && isLevelCleared(z)) {
          if (z.x + z.w < cameraX || z.x > cameraX + viewW ||
              z.y + z.h < cameraY || z.y > cameraY + viewH) {
            continue;
          }

          if (!window.portalGradCache) {
            let off = document.createElement('canvas');
            off.width = 400; 
            off.height = 400;
            let oCtx = off.getContext('2d');
            if (oCtx && oCtx.createConicGradient) {
              let grad = oCtx.createConicGradient(0, 200, 200);
              grad.addColorStop(0, "#ff0000"); 
              grad.addColorStop(0.15, "#ff7f00"); 
              grad.addColorStop(0.33, "#ffff00"); 
              grad.addColorStop(0.5, "#00ff00"); 
              grad.addColorStop(0.66, "#0000ff"); 
              grad.addColorStop(0.83, "#ff00ff"); 
              grad.addColorStop(1, "#ff0000"); 
              oCtx.fillStyle = grad;
              oCtx.fillRect(0, 0, 400, 400);
              window.portalGradCache = off; 
            } else {
              window.portalGradCache = 'fallback'; 
            }
          }

          ctx.save();
          let cx = z.x + z.w / 2; 
          let cy = z.y + z.h / 2; 
          let portalAngle = (time / 800) * Math.PI * 2; 

          ctx.beginPath();
          ctx.rect(z.x - 12, z.y - 12, z.w + 24, z.h + 24); 
          ctx.rect(z.x, z.y, z.w, z.h);                     
          ctx.clip("evenodd");

          ctx.translate(cx, cy);
          if (window.portalGradCache !== 'fallback') {
            ctx.rotate(portalAngle);
            ctx.drawImage(window.portalGradCache, -200, -200); 
          } else {
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(-200, -200, 400, 400);
          }
          ctx.restore(); 

          if (z.img && z.img.complete && z.img.naturalWidth > 0) {
            ctx.drawImage(z.img, z.x, z.y, z.w, z.h);
          } else {
            ctx.fillStyle = z.color || '#2196f3'; 
            ctx.fillRect(z.x, z.y, z.w, z.h);
          }
        } 
        else {
          let sx = (z.starX !== undefined) ? z.starX : (z.x + z.w / 2);
          let sy = (z.starY !== undefined) ? z.starY : (z.y + z.h / 2);
          
          if (sx < cameraX - 150 || sx > cameraX + viewW + 150 ||
              sy < cameraY - 150 || sy > cameraY + viewH + 150) {
            continue;
          }

          ctx.save();
          let floatOffsetY = Math.sin(time / 300 + sx) * 16;
          let pulseScale = 1 + Math.sin(time / 400 + sy) * 0.08;

          ctx.translate(sx, sy + floatOffsetY);
          ctx.scale(pulseScale, pulseScale);

          ctx.drawImage(starCache, -starSize / 2, -starSize / 2);
          ctx.restore();
        }
      }

      // 傳送門會用到 portalGradCache，確保已建立
      if (!window.portalGradCache && isForestPortalOpen()) {
        let off = document.createElement('canvas');
        off.width = 400; off.height = 400;
        let oCtx = off.getContext('2d');
        if (oCtx && oCtx.createConicGradient) {
          let grad = oCtx.createConicGradient(0, 200, 200);
          grad.addColorStop(0, "#ff0000"); grad.addColorStop(0.15, "#ff7f00");
          grad.addColorStop(0.33, "#ffff00"); grad.addColorStop(0.5, "#00ff00");
          grad.addColorStop(0.66, "#0000ff"); grad.addColorStop(0.83, "#ff00ff");
          grad.addColorStop(1, "#ff0000");
          oCtx.fillStyle = grad;
          oCtx.fillRect(0, 0, 400, 400);
          window.portalGradCache = off;
        } else {
          window.portalGradCache = 'fallback';
        }
      }
      drawForestPortal(time);

      ctx.save();
      let offsetY = player.isMoving ? Math.sin(player.walkCycle * 2) * 5 : 0;
      let rotationAngle = player.isMoving ? Math.sin(player.walkCycle) * 0.15 : 0;
      ctx.translate(player.x, player.y + offsetY);
      ctx.rotate(rotationAngle);
      if (player.isFacingLeft) ctx.scale(-1, 1);
      
      if (playerImg.complete && playerImg.naturalWidth > 0) {
        ctx.drawImage(playerImg, -player.size/2, -player.size/2, player.size, player.size);
      } else {
        ctx.fillStyle = 'pink';
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
      }
      ctx.restore();

      if (isTutorialMode) {
        let fingerX = 0, fingerY = 0;
        if (lobbyTutorialStep === 3) { fingerX = 1159; fingerY = 800; }
        else if (lobbyTutorialStep === 4) { fingerX = 1661; fingerY = 905; }
        else if (lobbyTutorialStep === 6) { fingerX = 1499; fingerY = 610; }
        
        if (fingerX > 0) {
          ctx.save();
          let bounce = Math.sin(time / 150) * 15;
          ctx.font = '80px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('👇', fingerX, fingerY - 80 + bounce);
          
          ctx.strokeStyle = '#40ff80';
          ctx.lineWidth = 6;
          ctx.shadowColor = '#40ff80';
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(fingerX, fingerY, 60, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      ctx.restore(); 
      drawOffscreenPointer();
    }

    function drawOffscreenPointer() {
      let pxScreen = (player.x - cameraX) * scale;
      let pyScreen = (player.y - cameraY) * scale;
      let margin = 40;
      let isOffscreen = (
        pxScreen < margin || pxScreen > canvas.width - margin ||
        pyScreen < margin || pyScreen > canvas.height - margin
      );

      if (isOffscreen) {
        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let angle = Math.atan2(pyScreen - cy, pxScreen - cx);
        let arrowX = Math.max(margin, Math.min(canvas.width - margin, pxScreen));
        let arrowY = Math.max(margin, Math.min(canvas.height - margin, pyScreen));

        ctx.save();
        ctx.translate(arrowX, arrowY);
        ctx.rotate(angle);
        
        ctx.fillStyle = '#ffeb3b'; 
        ctx.strokeStyle = '#ff5722'; 
        ctx.lineWidth = 3;
        
        ctx.beginPath();
        ctx.moveTo(25, 0);       
        ctx.lineTo(-20, 20);     
        ctx.lineTo(-10, 0);      
        ctx.lineTo(-20, -20);    
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.restore();
      }
    }

    const activePointers = new Map();
    let isPointerDown = false; 
    let isDragActive = false;  
    let hasMoved = false;
    let dragStart = { x: 0, y: 0 };
    let camStart = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialScale = 1;
    let pinchCenter = { x: 0, y: 0 };

    canvas.addEventListener('pointerdown', (e) => {
      if (handleLobbyDialogClick()) return; 

      if (e.target !== canvas || isModalOpen) return;
      if (isTutorialMode && activePointers.size > 0) return; 
      
      canvas.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, e);

      if (activePointers.size === 1) {
        isPointerDown = true;
        isDragActive = false; 
        hasMoved = false;
        dragStart = { x: e.clientX, y: e.clientY };
        camStart = { x: cameraX, y: cameraY };
      } else if (activePointers.size === 2) {
        isPointerDown = false;
        isDragActive = false;
        hasMoved = true; 
        let pts = Array.from(activePointers.values());
        initialPinchDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
        initialScale = scale;
        
        const rect = canvas.getBoundingClientRect();
        pinchCenter = {
          x: (pts[0].clientX + pts[1].clientX) / 2 - rect.left,
          y: (pts[0].clientY + pts[1].clientY) / 2 - rect.top
        };
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId) || isModalOpen) return;
      activePointers.set(e.pointerId, e);

      if (isTutorialMode) return; 

      if (activePointers.size === 1 && isPointerDown) {
        let dx = e.clientX - dragStart.x;
        let dy = e.clientY - dragStart.y;
        
        if (!isDragActive) {
          if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
            isDragActive = true;
            hasMoved = true;
            dragStart = { x: e.clientX, y: e.clientY };
            camStart = { x: cameraX, y: cameraY };
          }
        }
        
        if (isDragActive) {
          cameraX = camStart.x - (e.clientX - dragStart.x) / scale;
          cameraY = camStart.y - (e.clientY - dragStart.y) / scale;
          clampCamera();
        }
        
      } else if (activePointers.size === 2) {
        let pts = Array.from(activePointers.values());
        let currentDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
        
        let newScale = initialScale * (currentDist / initialPinchDist);
        newScale = Math.max(minScale, Math.min(newScale, 2.5)); 
        
        const rect = canvas.getBoundingClientRect();
        let currentPinchCenter = {
          x: (pts[0].clientX + pts[1].clientX) / 2 - rect.left,
          y: (pts[0].clientY + pts[1].clientY) / 2 - rect.top
        };

        let oldWorldX = pinchCenter.x / scale + cameraX;
        let oldWorldY = pinchCenter.y / scale + cameraY;
        
        scale = newScale;
        cameraX = oldWorldX - currentPinchCenter.x / scale;
        cameraY = oldWorldY - currentPinchCenter.y / scale;
        
        pinchCenter = currentPinchCenter;
        
        clampCamera();
      }
    });

    const onPointerUp = (e) => {
      activePointers.delete(e.pointerId);
      if (isModalOpen) return;
      
      if (activePointers.size === 0) {
        if (isPointerDown && !hasMoved) {
          const rect = canvas.getBoundingClientRect();
          let clientX = e.clientX - rect.left;
          let clientY = e.clientY - rect.top;

          let clickWorldX = (clientX / scale) + cameraX;
          let clickWorldY = (clientY / scale) + cameraY;
          
          clickWorldX = Math.max(0, Math.min(clickWorldX, MAP_WIDTH));
          clickWorldY = Math.max(0, Math.min(clickWorldY, MAP_HEIGHT));

          if (isTutorialMode) {
            if (lobbyTutorialStep === 3) {
              if (Math.hypot(clickWorldX - 1159, clickWorldY - 800) > 150) return;
              clickWorldX = 1159; clickWorldY = 800; 
            } else if (lobbyTutorialStep === 4) {
              if (Math.hypot(clickWorldX - 1661, clickWorldY - 905) > 150) return;
              clickWorldX = 1661; clickWorldY = 905;
            } else if (lobbyTutorialStep === 6) {
              if (Math.hypot(clickWorldX - 1499, clickWorldY - 610) > 150) return;
              clickWorldX = 1499; clickWorldY = 610;
            } else {
              return; 
            }
          }

          player.isFacingLeft = clickWorldX < player.x;
          player.targetX = clickWorldX;
          player.targetY = clickWorldY;
          player.isMoving = true;
        }
        isPointerDown = false;
        isDragActive = false;
      } else if (activePointers.size === 1) {
        let ptr = Array.from(activePointers.values())[0];
        isPointerDown = true;
        isDragActive = true; 
        hasMoved = true; 
        dragStart = { x: ptr.clientX, y: ptr.clientY };
        camStart = { x: cameraX, y: cameraY };
      }
    };

    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('pointerout', onPointerUp);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isModalOpen || isTutorialMode) return; 
      
      let zoomFactor = e.deltaY > 0 ? 0.9 : 1.1; 
      let newScale = Math.max(minScale, Math.min(scale * zoomFactor, 2.5));
      
      const rect = canvas.getBoundingClientRect();
      let mouseX = e.clientX - rect.left;
      let mouseY = e.clientY - rect.top;
      
      let oldWorldX = mouseX / scale + cameraX;
      let oldWorldY = mouseY / scale + cameraY;
      
      scale = newScale;
      cameraX = oldWorldX - mouseX / scale;
      cameraY = oldWorldY - mouseY / scale;
      
      clampCamera();
    }, { passive: false });

    if (window.Bopomofo) window.Bopomofo.render();
    lobbyAnimId = requestAnimationFrame(gameLoop);
  </script>
  
  <script src="rpg-dialog-ui.js"></script>
</body>
