<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>粢涵尋寶去 - 大廳</title>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="尋寶大廳">
  
  <script src="bopomofo.js"></script>

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body { 
      width: 100%; 
      height: 100%;
      margin: 0; 
      padding: 0;
      overflow: hidden; 
      background-color: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(30, 30, 30, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(env(safe-area-inset-top), 12px) 20px 12px 20px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: z-index 0.1s; /* 教學模式升降層級用 */
    }

    #hud {
      color: #fff; 
      font-size: 26px; 
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      padding: 5px 15px;
      border-radius: 20px;
      background: rgba(0,0,0,0.3);
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    #quick-menu {
      display: flex;
      gap: 15px;
      align-items: center;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .btn-floating {
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      border: 3px solid #fff;
      border-radius: 50%;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.6);
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.3s ease, filter 0.3s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-floating:active {
      transform: scale(0.85);
      box-shadow: 0 2px 6px rgba(255, 105, 180, 0.5);
    }

    /* 🌟 教學模式用的樣式與動畫 🌟 */
    .tutorial-highlight { 
      pointer-events: none !important; 
    }
    .dimmed { 
      opacity: 0.25 !important; 
      filter: grayscale(80%) brightness(0.5); 
      pointer-events: none; 
    }
    @keyframes finger-bounce-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #reward-modal {
      position: fixed;
      inset: 0;
      z-index: 1000; 
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px); 
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #reward-modal.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10000;
    }

    #reward-modal-content {
      background-color: #1e293b;
      border-radius: 3rem;       
      padding: 2.5rem 1.8rem 2rem 1.8rem;
      max-width: 560px;
      width: 90%;
      margin: 0 16px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 10px solid #475569; 
      position: relative;
      transform: scale(0.9);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #reward-modal.active #reward-modal-content {
      transform: scale(1);
    }

    #reward-badge {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #f59e0b; 
      color: #ffffff;
      padding: 8px 28px;
      border-radius: 9999px;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      border: 4px solid #ffffff;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 260px;
    }

    #reward-img-box {
      position: relative;
      width: clamp(180px, 45vw, 240px);
      height: clamp(180px, 45vw, 240px);
      margin: 20px auto 20px auto;
      background-color: #334155; 
      border-radius: 2.5rem;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 8px solid #475569; 
    }

    #reward-bg-ray {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(253, 230, 138, 0.55) 0%, rgba(253, 230, 138, 0) 70%);
      animation: pulse-ray 2s infinite ease-in-out;
    }

    @keyframes pulse-ray {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    #reward-img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      position: relative;
      z-index: 10;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
    }

    #reward-coin-icon {
      font-size: clamp(90px, 22vw, 130px);

      z-index: 10;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));

    #reward-info-box {

      margin-bottom: 20px;
      border: 2px solid #64748b;

    #reward-title {

      background-color: #10b981; 
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(24px, 5.5vw, 32px);
      padding: 16px 24px;
      border-radius: 1.25rem;
      border: 4px solid #a7f3d0;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, background-color 0.15s ease;
      touch-action: manipulation;
    }

    #btn-claim-reward:hover {
      background-color: #059669;
    }

    #btn-claim-reward:active {
      transform: scale(0.95);
    }

    #reward-modal .char-block { margin-right: 0.6em; margin-bottom: 6px; }
    #reward-modal .bopo { font-size: 0.4em; font-weight: 800; margin-left: 4px; letter-spacing: 0px; line-height: 1.15; color: #fcd34d; }

    /* 🌟 版本號碼顯示樣式 🌟 */
    #version-display {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.15s ease;
      white-space: nowrap;
      text-shadow: none;
    }
    
    #version-display:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }

    /* 🌟 更新公告彈窗樣式 🌟 */
    #update-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #update-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #update-modal-content {
      background-color: #1e293b;
      border-radius: 2rem;
      padding: 2rem 1.8rem;
      max-width: 500px;
      width: 85%;
      margin: 0 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 6px solid #64748b;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
    }

    #update-modal.active #update-modal-content {
      transform: scale(1);
    }

    .update-title {
      color: #38bdf8;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 900;
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 2px dashed #475569;
      padding-bottom: 15px;
    }

    .update-log {
      color: #fff;
      font-size: 18px;
      line-height: 1.8;
      max-height: 40vh;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 10px;
      text-align: left;
    }

    /* 滾動條美化 */
    .update-log::-webkit-scrollbar { width: 6px; }
    .update-log::-webkit-scrollbar-track { background: #334155; border-radius: 3px; }
    .update-log::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }

    #btn-close-update {
      background-color: #3b82f6;
      color: #ffffff;
      font-weight: bold;
      font-size: 22px;
      padding: 12px;
      border-radius: 1rem;
      border: 3px solid #93c5fd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    #btn-close-update:active { transform: scale(0.95); }
  </style>
</head>

  <!-- 🌟 更新公告彈窗 🌟 -->

  <canvas id="lobbyCanvas"></canvas>

  <script src="assets-manifest.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload(); 
        }
      });
      navigator.serviceWorker.register('sw.js')
        .then((reg) => {
          console.log('Service Worker 註冊成功');
          reg.update(); 
        })
        .catch((err) => console.warn('Service Worker 註冊失敗:', err));
    }

    async function runPreloader() {
      const bar = document.getElementById('progress-bar');
      const text = document.getElementById('progress-text');
      const preloader = document.getElementById('preloader');

      const cacheName = typeof CACHE_NAME !== 'undefined' ? CACHE_NAME : (typeof GAME_CACHE_NAME !== 'undefined' ? GAME_CACHE_NAME : 'game-cache');
      const assetsList = typeof GAME_ASSETS !== 'undefined' ? GAME_ASSETS : [];
      
      if (assetsList.length > 0 && 'caches' in window) {
        const cache = await caches.open(cacheName);
        let loadedCount = 0;
        const total = assetsList.length;

        await Promise.all(assetsList.map(async (url) => {
          try {
            const match = await cache.match(url);
            if (!match) {
              const res = await fetch(url, { cache: 'reload' });
              if (res.ok) await cache.put(url, res);
            }
          } catch (err) {
            console.warn('預載失敗:', url);
          } finally {
            loadedCount++;
            const percent = Math.round((loadedCount / total) * 100);
            if (bar) bar.style.width = percent + '%';
            if (text) text.innerText = percent + '%';
          }
        }));
      }

      setTimeout(() => {
        if (preloader) {
          preloader.style.transition = 'opacity 0.5s ease';
          preloader.style.opacity = '0';
          setTimeout(() => {
            preloader.remove();
            checkUpdateAndTutorial(); // 🌟 修改：呼叫新寫的版本與教學檢查
          }, 500);
        } else {
          checkUpdateAndTutorial(); // 🌟 修改：呼叫新寫的版本與教學檢查
        }
      }, 200);
    }

    window.addEventListener('DOMContentLoaded', runPreloader);
  </script>

  <script>
    (function () {
      if (window.Bopomofo) return;
      const style = document.createElement('style');
      style.id = 'bopo-module-style';
      style.textContent = `
        .char-block {
          display: inline-flex; flex-direction: row; align-items: center;
          margin-right: 0.55em; margin-bottom: 4px; vertical-align: middle; line-height: 1;
        }
        .bopo {
          writing-mode: vertical-rl; text-orientation: upright; font-size: 0.35em;
          color: #ffeb3b; margin-left: 2px; position: relative; padding: 0;
          line-height: 1.1; letter-spacing: -1px;
        }
        .bopo .tone {
          position: absolute; right: -0.9em; top: 50%;
          font-family: "標楷體", "BiauKai", "DFKai-SB", serif;
          font-size: 1.07em; font-weight: bold;
          transform: translateY(-50%) scaleY(1.3); pointer-events: none;
        }
        .bopo .tone.sp {
          position: absolute; left: 50%; right: auto; top: -0.55em;
          transform: translateX(-50%);
          font-family: -apple-system, BlinkMacSystemFont, sans-serif;
          font-size: 1.6em; line-height: 1; font-weight: 900; pointer-events: none;
        }
        .zh-text {
          display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center;
        }
      `;
      document.head.appendChild(style);

      function convertRuby(rubyElement) {
        const charText = Array.from(rubyElement.childNodes)
          .filter(node => node.nodeType === Node.TEXT_NODE)
          .map(node => node.textContent).join('').trim();
        const rt = rubyElement.querySelector('rt');
        if (!rt) return;
        let bopoText = rt.textContent.trim();
        let tone = '';
        let bopoBase = bopoText;
        const normalTones = ['ˊ', 'ˇ', 'ˋ'];
        if (bopoText.includes('˙')) {
          tone = '˙';
          bopoBase = bopoText.replace(/˙/g, '');
        } else if (normalTones.includes(bopoText.slice(-1))) {
          tone = bopoText.slice(-1);
          bopoBase = bopoText.slice(0, -1);
        }
        const charBlock = document.createElement('span');
        charBlock.className = 'char-block';
        const charSpan = document.createElement('span');
        charSpan.textContent = charText;
        charBlock.appendChild(charSpan);
        const bopoSpan = document.createElement('span');
        bopoSpan.className = 'bopo';
        bopoSpan.textContent = bopoBase;
        if (tone) {
          const toneSpan = document.createElement('span');
          toneSpan.className = tone === '˙' ? 'tone sp' : 'tone';
          toneSpan.textContent = tone;
          bopoSpan.appendChild(toneSpan);
        }
        charBlock.appendChild(bopoSpan);
        rubyElement.replaceWith(charBlock);
      }

      function renderAll() {
        document.querySelectorAll('ruby').forEach(convertRuby);
      }
      window.Bopomofo = { render: renderAll, convert: convertRuby };
    })();

    const canvas = document.getElementById('lobbyCanvas');
    const ctx = canvas.getContext('2d');

    // 暫時的修復補丁：清除錯誤的飛龍貼紙紀錄
    if (localStorage.getItem('blindbox_slobby2') === 'claimed' && localStorage.getItem('sticker_s14') === 'new') {
        localStorage.removeItem('blindbox_slobby2'); // 讓大廳星星重新出現
        localStorage.removeItem('sticker_s14');      // 刪除貼紙簿裡的虛空貼紙紀錄
    }
    //下次更新刪除

    // ==========================================
    // 🌟 遊戲版本與更新公告設定 🌟
    // ==========================================
    
    // 👇 1. 每次更新時請修改這個版本號碼
    const GAME_VERSION = "v2.4"; 
    
    // 👇 2. 【這是公告開關】
    // 設為 true：更新後玩家進入大廳會自動彈出公告
    // 設為 false：不會自動彈出，適合微調或例行維護（玩家可自行點擊左上角版本號查看）
    const AUTO_SHOW_NOTICE = true; 
    
    // 👇 3. 【這是公告內容】
    // 在此輸入注音內容，支援 bopomofo.js 的 <ruby> 標籤
    const UPDATE_LOG = `
      <p>✨ <b><ruby>增<rt>ㄗㄥ</rt></ruby><ruby>加<rt>ㄐㄧㄚ</rt></ruby><ruby>版<rt>ㄅㄢˇ</rt></ruby><ruby>本<rt>ㄅㄣˇ</rt></ruby><ruby>號<rt>ㄏㄠˋ</rt></ruby><ruby>以<rt>ㄧˇ</rt></ruby><ruby>及<rt>ㄐㄧˊ</rt></ruby><ruby>版<rt>ㄅㄢˇ</rt></ruby><ruby>本<rt>ㄅㄣˇ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>告<rt>ㄍㄠˋ</rt></ruby></b></p>
    `;

    // 顯示更新公告
    function showUpdateNotice() {
      const contentDiv = document.getElementById('update-log-content');
      contentDiv.innerHTML = UPDATE_LOG;
      if (window.Bopomofo) window.Bopomofo.render();
      document.getElementById('update-modal').classList.add('active');
    }

    // 🌟 控制 UI 高光與變暗效果
    function highlightDOM(elementId) {
      document.getElementById('dom-tutorial-overlay').style.display = 'block';
      
      // 將頂部列提上來到遮罩上方
      document.getElementById('top-bar').style.zIndex = '9001'; 
      
      // 清除先前的特效
      document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
      document.querySelectorAll('.dimmed').forEach(el => el.classList.remove('dimmed'));
      
      let target = document.getElementById(elementId);
      if (target) {
        target.classList.add('tutorial-highlight');
        
        // 將「沒被指到」的元素變暗
        if (elementId === 'hud') {
          document.getElementById('quick-menu').classList.add('dimmed');
        } else if (elementId === 'btn-wardrobe') {
          document.getElementById('hud').classList.add('dimmed');
          document.getElementById('btn-sticker').classList.add('dimmed');
        } else if (elementId === 'btn-sticker') {
          document.getElementById('hud').classList.add('dimmed');
          document.getElementById('btn-wardrobe').classList.add('dimmed');
        }

        let rect = target.getBoundingClientRect();
        let finger = document.getElementById('dom-tutorial-finger');
        finger.style.display = 'block';
        
        // 手指定位：置中於元素，並位於元素下方往上指
        finger.innerHTML = '👆';
        finger.style.left = (rect.left + rect.width / 2 - 30) + 'px'; // 30 是字體大小 60 的一半
        finger.style.top = (rect.bottom + 15) + 'px'; 
      }
    }

    const MAP_WIDTH = 3000;
    const MAP_HEIGHT = 4000;

    let scale = 1.0;
    let minScale = 1.0; 
    let cameraX = 0;
    let cameraY = 0;

    function clampCamera() {
      let viewW = canvas.width / scale;
      let viewH = canvas.height / scale;

      if (viewW > MAP_WIDTH) {
        cameraX = -(viewW - MAP_WIDTH) / 2;
      } else {
        cameraX = Math.max(0, Math.min(cameraX, MAP_WIDTH - viewW));
      }

      if (viewH > MAP_HEIGHT) {
        cameraY = -(viewH - MAP_HEIGHT) / 2;
      } else {
        cameraY = Math.max(0, Math.min(cameraY, MAP_HEIGHT - viewH));
      }
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      minScale = canvas.width / (MAP_WIDTH / 2);

      }

    function isLevelCleared(z) {
      const key = z.clearKey || (z.id + '_cleared');
      return localStorage.getItem(key) === 'true';
    }

    let isModalOpen = false;
    let activeRewardZone = null;

    const rewardModal = document.getElementById('reward-modal');
    const rewardBadge = document.getElementById('reward-badge');
    const rewardImg = document.getElementById('reward-img');
    const rewardCoinIcon = document.getElementById('reward-coin-icon');
    const rewardTitle = document.getElementById('reward-title');

    function openRewardModal(zone) {
      isModalOpen = true;
      activeRewardZone = zone;
      player.isMoving = false; 

      if (zone.type === '貼紙') {
        rewardBadge.innerHTML = `<span class="zh-text"><ruby>貼<rt>ㄊㄧㄝ</rt></ruby><ruby>紙<rt>ㄓˇ</rt></ruby></span>`;
        rewardImg.src = zone.stickerSrc || '';
        rewardImg.style.display = 'block';
        rewardCoinIcon.style.display = 'none';
        rewardTitle.innerHTML = zone.stickerName || '';
      } else if (zone.type === '金幣') {
        rewardBadge.innerHTML = `<span class="zh-text"><ruby>星<rt>ㄒㄧㄥ</rt></ruby><ruby>星<rt>ㄒㄧㄥ</rt></ruby></span>`;
        rewardImg.style.display = 'none';
        rewardCoinIcon.style.display = 'block';
        rewardTitle.innerHTML = `⭐ + ${zone.rewardAmount || 0}`;
      }

      if (window.Bopomofo) window.Bopomofo.render();
      rewardModal.classList.add('active');
    }

    function closeRewardModal() {
      rewardModal.classList.remove('active');
      isModalOpen = false;
      activeRewardZone = null;

      if (isTutorialMode && lobbyTutorialStep === 6) {
        setTimeout(() => {
          nextTutorialStep(); 
        }, 300);
      }
    }

    function claimCurrentReward() {
      if (!activeRewardZone) return;
      const z = activeRewardZone;

      if (z.type === '貼紙') {
        if (z.stickerId) {
          const currentStatus = localStorage.getItem('sticker_' + z.stickerId);
          if (currentStatus !== 'true') {
            localStorage.setItem('sticker_' + z.stickerId, 'new');
          }
        }
        localStorage.setItem('blindbox_' + z.id, 'claimed');
      } else if (z.type === '金幣') {
        const addAmount = parseInt(z.rewardAmount || 0, 10);
        playerCoins += addAmount;
        localStorage.setItem('playerCoins', playerCoins);
        document.getElementById('coinDisplay').innerText = playerCoins;
        localStorage.setItem('blindbox_' + z.id, 'claimed');
      }

      closeRewardModal();
    }

    let lastTime = performance.now();
    function gameLoop(currentTime) {
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      update(Math.min(dt, 0.1));
      draw(currentTime); 
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      if (isTutorialMode) {
        let targetCamX = player.x - (canvas.width / scale) / 2;
        let targetCamY = player.y - (canvas.height / scale) / 2;
        cameraX += (targetCamX - cameraX) * 0.1;
        cameraY += (targetCamY - cameraY) * 0.1;
        clampCamera();
      }

      if (isModalOpen) return; 

      if (player.isMoving) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let moveDist = player.speed * dt;

        if (distance > moveDist) {
          player.x += (dx / distance) * moveDist;
          player.y += (dy / distance) * moveDist;
          player.walkCycle += 20 * dt;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
          player.isMoving = false;
          player.walkCycle = 0;
          savePlayerPosition();
          checkZones();

          if (isTutorialMode) {
            if (lobbyTutorialStep === 3) {
              nextTutorialStep(); 
            } else if (lobbyTutorialStep === 4) {
              nextTutorialStep(); 
            }
          }
        }
      }
    }

   function checkZones() {
      if (isModalOpen) return;

      for (let z of zones) {
        let isPortal = (z.type === '關卡' && isLevelCleared(z));
        let isHit = false;

        if (isPortal) {
          isHit = (player.x > z.x && player.x < z.x + z.w && 
                   player.y > z.y && player.y < z.y + z.h);
        } else {
          let sx = (z.starX !== undefined) ? z.starX : (z.x + z.w / 2);
          let sy = (z.starY !== undefined) ? z.starY : (z.y + z.h / 2);
          let starHitSize = 150; 
          let half = starHitSize / 2;
          isHit = (player.x > sx - half && player.x < sx + half && 
                   player.y > sy - half && player.y < sy + half);
        }

        if (isHit) {
          if (z.type === '關卡') {
            savePlayerPosition();
            window.location.href = z.targetUrl || (z.id + '.html');
            return;
          } 
          else if (z.type === '貼紙' || z.type === '金幣') {
            if (isZoneClaimed(z)) continue; 
            savePlayerPosition();
            openRewardModal(z);
            return;
          }
        }
      }
    }

    function draw(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(scale, scale);
      ctx.translate(-cameraX, -cameraY);

      // 修改1：背景圖片的安全檢查
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, MAP_WIDTH, MAP_HEIGHT);
      } else {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
      }

      let viewW = canvas.width / scale;
      let viewH = canvas.height / scale;

      for (let z of zones) {
        if ((z.type === '貼紙' || z.type === '金幣') && isZoneClaimed(z)) {
          continue;
        }

        if (z.type === '關卡' && isLevelCleared(z)) {
          if (z.x + z.w < cameraX || z.x > cameraX + viewW ||
              z.y + z.h < cameraY || z.y > cameraY + viewH) {
            continue;
          }

          // 1. 建立全域快取：把漸層畫在一張隱形的畫布上，遊戲開啟期間只計算一次
          if (!window.portalGradCache) {
            let off = document.createElement('canvas');
            off.width = 400; // 傳送門對角線約 375，400 夠大
            off.height = 400;
            let oCtx = off.getContext('2d');
            if (oCtx && oCtx.createConicGradient) {
              let grad = oCtx.createConicGradient(0, 200, 200);
              grad.addColorStop(0, "#ff0000"); 
              grad.addColorStop(0.15, "#ff7f00"); 
              grad.addColorStop(0.33, "#ffff00"); 
              grad.addColorStop(0.5, "#00ff00"); 
              grad.addColorStop(0.66, "#0000ff"); 
              grad.addColorStop(0.83, "#ff00ff"); 
              grad.addColorStop(1, "#ff0000"); 
              oCtx.fillStyle = grad;
              oCtx.fillRect(0, 0, 400, 400);
              window.portalGradCache = off; 
            } else {
              window.portalGradCache = 'fallback'; 
            }
          }

          ctx.save();
          let cx = z.x + z.w / 2; 
          let cy = z.y + z.h / 2; 
          let portalAngle = (time / 800) * Math.PI * 2; 

          // 2. 利用 clip("evenodd") 製作「只有邊框」的中空遮罩
          // 尺寸精確對齊原本 lineWidth=12 的範圍
          ctx.beginPath();
          ctx.rect(z.x - 12, z.y - 12, z.w + 24, z.h + 24); // 外側邊框範圍
          ctx.rect(z.x, z.y, z.w, z.h);                     // 內側範圍 (會被挖空，露出後面的地圖)
          ctx.clip("evenodd");

          // 3. 將座標原點移至中心點，旋轉畫布並貼上快取的漸層圖片
          ctx.translate(cx, cy);
          if (window.portalGradCache !== 'fallback') {
            ctx.rotate(portalAngle);
            ctx.drawImage(window.portalGradCache, -200, -200); 
          } else {
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(-200, -200, 400, 400);
          }
          ctx.restore(); // 解除裁切與旋轉，不影響後續地圖圖片的繪製

          // 修改2：修改關卡傳送門圖片的安全檢查
          if (z.img && z.img.complete && z.img.naturalWidth > 0) {
            ctx.drawImage(z.img, z.x, z.y, z.w, z.h);
          } else {
            ctx.fillStyle = z.color || '#2196f3'; 
            ctx.fillRect(z.x, z.y, z.w, z.h);
          }
        } 
        else {
          let sx = (z.starX !== undefined) ? z.starX : (z.x + z.w / 2);
          let sy = (z.starY !== undefined) ? z.starY : (z.y + z.h / 2);
          
          if (sx < cameraX - 150 || sx > cameraX + viewW + 150 ||
              sy < cameraY - 150 || sy > cameraY + viewH + 150) {
            continue;
          }

          ctx.save();
          let floatOffsetY = Math.sin(time / 300 + sx) * 16;
          let pulseScale = 1 + Math.sin(time / 400 + sy) * 0.08;

          ctx.translate(sx, sy + floatOffsetY);
          ctx.scale(pulseScale, pulseScale);

          ctx.drawImage(starCache, -starSize / 2, -starSize / 2);
          ctx.restore();
        }
      }

      ctx.save();
      let offsetY = player.isMoving ? Math.sin(player.walkCycle * 2) * 5 : 0;
      let rotationAngle = player.isMoving ? Math.sin(player.walkCycle) * 0.15 : 0;
      ctx.translate(player.x, player.y + offsetY);
      ctx.rotate(rotationAngle);
      if (player.isFacingLeft) ctx.scale(-1, 1);
      
      // 修改3：修改人物圖片的安全檢查
      if (playerImg.complete && playerImg.naturalWidth > 0) {
        ctx.drawImage(playerImg, -player.size/2, -player.size/2, player.size, player.size);
      } else {
        ctx.fillStyle = 'pink';
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
      }
      ctx.restore();

      if (isTutorialMode) {
        let fingerX = 0, fingerY = 0;
        if (lobbyTutorialStep === 3) { fingerX = 1159; fingerY = 800; }
        else if (lobbyTutorialStep === 4) { fingerX = 1661; fingerY = 905; }
        else if (lobbyTutorialStep === 6) { fingerX = 1499; fingerY = 610; }
        
        if (fingerX > 0) {
          ctx.save();
          let bounce = Math.sin(time / 150) * 15;
          ctx.font = '80px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('👇', fingerX, fingerY - 80 + bounce);
          
          ctx.strokeStyle = '#40ff80';
          ctx.lineWidth = 6;
          ctx.shadowColor = '#40ff80';
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(fingerX, fingerY, 60, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      ctx.restore(); 
      drawOffscreenPointer();
    }

    function drawOffscreenPointer() {
      let pxScreen = (player.x - cameraX) * scale;
      let pyScreen = (player.y - cameraY) * scale;
      let margin = 40;
      let isOffscreen = (
        pxScreen < margin || pxScreen > canvas.width - margin ||
        pyScreen < margin || pyScreen > canvas.height - margin
      );

      if (isOffscreen) {
        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let angle = Math.atan2(pyScreen - cy, pxScreen - cx);
        let arrowX = Math.max(margin, Math.min(canvas.width - margin, pxScreen));
        let arrowY = Math.max(margin, Math.min(canvas.height - margin, pyScreen));

        ctx.save();
        ctx.translate(arrowX, arrowY);
        ctx.rotate(angle);
        
        ctx.fillStyle = '#ffeb3b'; 
        ctx.strokeStyle = '#ff5722'; 
        ctx.lineWidth = 3;
        
        ctx.beginPath();
        ctx.moveTo(25, 0);       
        ctx.lineTo(-20, 20);     
        ctx.lineTo(-10, 0);      
        ctx.lineTo(-20, -20);    
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.restore();
      }
    }

    const activePointers = new Map();
    let isPointerDown = false; 
    let isDragActive = false;  
    let hasMoved = false;
    let dragStart = { x: 0, y: 0 };
    let camStart = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialScale = 1;
    let pinchCenter = { x: 0, y: 0 };

    canvas.addEventListener('pointerdown', (e) => {
      if (handleLobbyDialogClick()) return; 

      if (e.target !== canvas || isModalOpen) return;
      if (isTutorialMode && activePointers.size > 0) return; 
      
      canvas.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, e);

      if (activePointers.size === 1) {
        isPointerDown = true;
        isDragActive = false; 
        hasMoved = false;
        dragStart = { x: e.clientX, y: e.clientY };
        camStart = { x: cameraX, y: cameraY };
      } else if (activePointers.size === 2) {
        isPointerDown = false;
        isDragActive = false;
        hasMoved = true; 
        let pts = Array.from(activePointers.values());
        initialPinchDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
        initialScale = scale;
        
        const rect = canvas.getBoundingClientRect();
        pinchCenter = {
          x: (pts[0].clientX + pts[1].clientX) / 2 - rect.left,
          y: (pts[0].clientY + pts[1].clientY) / 2 - rect.top
        };
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId) || isModalOpen) return;
      activePointers.set(e.pointerId, e);

      if (isTutorialMode) return; 

      if (activePointers.size === 1 && isPointerDown) {
        let dx = e.clientX - dragStart.x;
        let dy = e.clientY - dragStart.y;
        
        if (!isDragActive) {
          if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
            isDragActive = true;
            hasMoved = true;
            dragStart = { x: e.clientX, y: e.clientY };
            camStart = { x: cameraX, y: cameraY };
          }
        }
        
        if (isDragActive) {
          cameraX = camStart.x - (e.clientX - dragStart.x) / scale;
          cameraY = camStart.y - (e.clientY - dragStart.y) / scale;
          clampCamera();
        }
        
      } else if (activePointers.size === 2) {
        let pts = Array.from(activePointers.values());
        let currentDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
        
        let newScale = initialScale * (currentDist / initialPinchDist);
        newScale = Math.max(minScale, Math.min(newScale, 2.5)); 
        
        const rect = canvas.getBoundingClientRect();
        let currentPinchCenter = {
          x: (pts[0].clientX + pts[1].clientX) / 2 - rect.left,
          y: (pts[0].clientY + pts[1].clientY) / 2 - rect.top
        };

        let oldWorldX = pinchCenter.x / scale + cameraX;
        let oldWorldY = pinchCenter.y / scale + cameraY;
        
        scale = newScale;
        cameraX = oldWorldX - currentPinchCenter.x / scale;
        cameraY = oldWorldY - currentPinchCenter.y / scale;
        
        pinchCenter = currentPinchCenter;
        
        clampCamera();
      }
    });

    const onPointerUp = (e) => {
      activePointers.delete(e.pointerId);
      if (isModalOpen) return;
      
      if (activePointers.size === 0) {
        if (isPointerDown && !hasMoved) {
          const rect = canvas.getBoundingClientRect();
          let clientX = e.clientX - rect.left;
          let clientY = e.clientY - rect.top;

          let clickWorldX = (clientX / scale) + cameraX;
          let clickWorldY = (clientY / scale) + cameraY;
          
          clickWorldX = Math.max(0, Math.min(clickWorldX, MAP_WIDTH));
          clickWorldY = Math.max(0, Math.min(clickWorldY, MAP_HEIGHT));

          if (isTutorialMode) {
            if (lobbyTutorialStep === 3) {
              if (Math.hypot(clickWorldX - 1159, clickWorldY - 800) > 150) return;
              clickWorldX = 1159; clickWorldY = 800; 
            } else if (lobbyTutorialStep === 4) {
              if (Math.hypot(clickWorldX - 1661, clickWorldY - 905) > 150) return;
              clickWorldX = 1661; clickWorldY = 905;
            } else if (lobbyTutorialStep === 6) {
              if (Math.hypot(clickWorldX - 1499, clickWorldY - 610) > 150) return;
              clickWorldX = 1499; clickWorldY = 610;
            } else {
              return; 
            }
          }

          player.isFacingLeft = clickWorldX < player.x;
          player.targetX = clickWorldX;
          player.targetY = clickWorldY;
          player.isMoving = true;
        }
        isPointerDown = false;
        isDragActive = false;
      } else if (activePointers.size === 1) {
        let ptr = Array.from(activePointers.values())[0];
        isPointerDown = true;
        isDragActive = true; 
        hasMoved = true; 
        dragStart = { x: ptr.clientX, y: ptr.clientY };
        camStart = { x: cameraX, y: cameraY };
      }
    };

    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('pointerout', onPointerUp);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isModalOpen || isTutorialMode) return; 
      
      let zoomFactor = e.deltaY > 0 ? 0.9 : 1.1; 
      let newScale = Math.max(minScale, Math.min(scale * zoomFactor, 2.5));
      
      const rect = canvas.getBoundingClientRect();
      let mouseX = e.clientX - rect.left;
      let mouseY = e.clientY - rect.top;
      
      let oldWorldX = mouseX / scale + cameraX;
      let oldWorldY = mouseY / scale + cameraY;
      
      scale = newScale;
      cameraX = oldWorldX - mouseX / scale;
      cameraY = oldWorldY - mouseY / scale;
      
      clampCamera();
    }, { passive: false });

    if (window.Bopomofo) window.Bopomofo.render();
    requestAnimationFrame(gameLoop);
  </script>
  
  <script src="rpg-dialog-ui.js"></script>
</body>
