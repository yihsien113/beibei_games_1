<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>冒險小遊戲 - 衣櫃</title>
  
  <!-- 引入外部注音模組 -->
  <script src="bopomofo.js"></script>
  <!-- 帳號密碼模組 -->
  <script src="password.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 95vw;
      max-width: 100%;
      max-height: 96vh;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }
    .top-bar > * {
      pointer-events: auto;
    }
    .btn-back {
      background: #333;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .coin-display {
      font-size: 22px;
      font-weight: bold;
      color: #ffeb3b;
      background: rgba(0,0,0,0.6);
      padding: 6px 16px;
      border-radius: 15px;
      backdrop-filter: blur(4px);
    }

    .wardrobe-wrapper {
      position: absolute;
      top: 75px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      z-index: 80;
      padding: 0 10px;
    }

    .scroll-arrow {
      position: absolute;
      top: 50%;
      font-size: 46px;
      color: #ffeb3b;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      z-index: 90;
      opacity: 1; /* 保持顯示 */
      transition: opacity 0.3s ease;
      pointer-events: auto; /* 允許點擊 */
      cursor: pointer;
    }
    .left-arrow { left: 5px; animation: bounce-left 1.2s infinite; }
    .right-arrow { right: 5px; animation: bounce-right 1.2s infinite; }

    @keyframes bounce-left {
      0%, 100% { transform: translate(0, -50%); }
      50% { transform: translate(-10px, -50%); }
    }
    @keyframes bounce-right {
      0%, 100% { transform: translate(0, -50%); }
      50% { transform: translate(10px, -50%); }
    }

    .scroll-container {
      display: flex;
      gap: 15px;
      width: 100%;
      padding: 10px 15px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }
    .scroll-container * {
      touch-action: pan-x;
    }
    .scroll-container::-webkit-scrollbar { display: none; }

    .char-card {
      scroll-snap-align: center;
      flex: 0 0 auto;
      background: rgba(22, 33, 62, 0.88);
      backdrop-filter: blur(6px);
      border: 3px solid #0f3460;
      border-radius: 18px;
      padding: 15px;
      text-align: center;
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .char-card.equipped {
      border-color: #4caf50;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.7);
    }
    .char-card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .char-name {
      font-size: 26px;
      margin-bottom: 16px;
      font-weight: bold;
      color: #fff;
    }
    .btn {
      padding: 12px 16px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      width: 100%;
    }
    .btn-equip { background-color: #2196f3; }
    .btn-buy { background-color: #e94560; }
    .btn:active { transform: scale(0.95); }

    .custom-modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .custom-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .custom-modal-box {
      background: #1e293b;
      border: 4px solid #facc15;
      border-radius: 28px;
      padding: 30px 20px;
      max-width: 95%;
      width: 520px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      transform: scale(0.85);
      transition: transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .custom-modal-overlay.active .custom-modal-box {
      transform: scale(1);
    }
    .modal-msg {
      font-size: 42px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.5;
      margin-bottom: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-modal-ok {
      background: #4caf50;
      color: #fff;
      font-size: 30px;
      font-weight: bold;
      padding: 10px 40px;
      border-radius: 35px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
    }
    .btn-modal-ok:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="top-bar">
      <button class="btn-back" onclick="location.href='index.html'">🔙 EXIT</button>
      <div class="coin-display"><span id="myCoins">0</span> ⭐</div>
    </div>

    <div class="wardrobe-wrapper" id="wardrobeWrapper">
      <div class="scroll-arrow left-arrow" id="leftArrow">◀</div>

      <div class="scroll-container" id="scrollContainer">
        <!-- 角色 1 -->
        <div class="char-card" data-char="han1">
          <img src="assets/player/han1-1.webp" alt="揮劍女孩">
          <div class="char-name"><ruby>揮<rt>ㄏㄨㄟ</rt></ruby><ruby>劍<rt>ㄐㄧㄢˋ</rt></ruby><ruby>女<rt>ㄋㄩˇ</rt></ruby><ruby>孩<rt>ㄏㄞˊ</rt></ruby></div>
          <button class="btn btn-equip" data-btn="han1" onclick="equipChar('han1')"></button>
        </div>

        <!-- 角色 2 -->
        <div class="char-card" data-char="han2">
          <img src="assets/player/han2-1.webp" alt="弓箭公主">
          <div class="char-name"><ruby>弓<rt>ㄍㄨㄥ</rt></ruby><ruby>箭<rt>ㄐㄧㄢˋ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>主<rt>ㄓㄨˇ</rt></ruby></div>
          <button class="btn btn-buy" data-btn="han2" onclick="buyOrEquip('han2', 40)"></button>
        </div>
        
        <!-- 角色 3 -->
        <div class="char-card" data-char="han3">
          <img src="assets/player/han3-1.webp" alt="魔法仙子">
          <div class="char-name"><ruby>魔<rt>ㄇㄛˊ</rt></ruby><ruby>法<rt>ㄈㄚˇ</rt></ruby><ruby>仙<rt>ㄒㄧㄢ</rt></ruby><ruby>子<rt>ㄗ˙</rt></ruby></div>
          <button class="btn btn-buy" data-btn="han3" onclick="buyOrEquip('han3', 40)"></button>
        </div>

        <!-- 角色 4：漩渦公主 -->
        <div class="char-card" data-char="han4">
          <img src="assets/player/han4-1.webp" alt="漩渦公主">
          <div class="char-name"><ruby>漩<rt>ㄒㄩㄢˊ</rt></ruby><ruby>渦<rt>ㄨㄛ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>主<rt>ㄓㄨˇ</rt></ruby></div>
          <button class="btn btn-buy" data-btn="han4" onclick="buyOrEquip('han4', 40)"></button>
        </div>

        <!-- 角色 5：愛心公主 -->
        <div class="char-card" data-char="han5">
          <img src="assets/player/han5-1.webp" alt="愛心公主">
          <div class="char-name"><ruby>愛<rt>ㄞˋ</rt></ruby><ruby>心<rt>ㄒㄧㄣ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>主<rt>ㄓㄨˇ</rt></ruby></div>
          <button class="btn btn-buy" data-btn="han5" onclick="buyOrEquip('han5', 40)"></button>
        </div>

        <!-- 角色 6：冰雪公主 -->
        <div class="char-card" data-char="han6">
          <img src="assets/player/han6-1.webp" alt="冰雪公主">
          <div class="char-name"><ruby>冰<rt>ㄅㄧㄥ</rt></ruby><ruby>雪<rt>ㄒㄩㄝˇ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>主<rt>ㄓㄨˇ</rt></ruby></div>
          <button class="btn btn-buy" data-btn="han6" onclick="buyOrEquip('han6', 40)"></button>
        </div>

        <!-- 角色 7：揮劍里長 -->
        <div class="char-card" data-char="chih1">
          <img src="assets/player/chih1-1.webp" alt="揮劍里長">
          <div class="char-name"><ruby>揮<rt>ㄏㄨㄟ</rt></ruby><ruby>劍<rt>ㄐㄧㄢˋ</rt></ruby><ruby>里<rt>ㄌㄧˇ</rt></ruby><ruby>長<rt>ㄓㄤˇ</rt></ruby></div>
          <button class="btn btn-buy" data-btn="chih1" onclick="buyOrEquip('chih1', 5)"></button>
        </div>

        <!-- 角色 8：弓箭男孩 -->
        <div class="char-card" data-char="chih2">
          <img src="assets/player/chih2-1.webp" alt="飛車男孩">
          <div class="char-name"><ruby>飛<rt>ㄈㄟ</rt></ruby><ruby>車<rt>ㄔㄜ</rt></ruby><ruby>男<rt>ㄋㄢˊ</rt></ruby><ruby>孩<rt>ㄏㄞˊ</rt></ruby></div>
          <button class="btn btn-buy" data-btn="chih2" onclick="buyOrEquip('chih2', 40)"></button>
        </div>
      </div>

      <div class="scroll-arrow right-arrow" id="rightArrow">▶</div>
    </div>

    <!-- 彈出視窗 -->
    <div class="custom-modal-overlay" id="customModal">
      <div class="custom-modal-box">
        <div class="modal-msg" id="modalMessage"></div>
        <button class="btn-modal-ok" onclick="closeModal()">
          <ruby>好<rt>ㄏㄠˇ</rt></ruby><ruby>的<rt>ㄉㄜ˙</rt></ruby 👍
        </button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 數據管理
    let coins = parseInt(localStorage.getItem('playerCoins') || '0');
    let equipped = localStorage.getItem('equippedCharacter') || 'han1';
    let ownsHan2 = localStorage.getItem('owns_han2') === 'true';
    let ownsHan3 = localStorage.getItem('owns_han3') === 'true';
    let ownsHan4 = localStorage.getItem('owns_han4') === 'true';
    let ownsHan5 = localStorage.getItem('owns_han5') === 'true';
    let ownsHan6 = localStorage.getItem('owns_han6') === 'true';
    let ownsChih1 = localStorage.getItem('owns_chih1') === 'true';
    let ownsChih2 = localStorage.getItem('owns_chih2') === 'true';

    if (!localStorage.getItem('sticker_shan1')) {
      localStorage.setItem('sticker_shan1', 'new');
    }

    document.getElementById('myCoins').innerText = coins;

    const TEXT_EQUIPPED = '<ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>用<rt>ㄩㄥˋ</rt></ruby> ✔️';
    const TEXT_EQUIP = '<ruby>換<rt>ㄏㄨㄢˋ</rt></ruby><ruby>上<rt>ㄕㄤˋ</rt></ruby>';
    const TEXT_BUY_5 = '<ruby>購<rt>ㄍㄡˋ</rt></ruby><ruby>買<rt>ㄇㄞˇ</rt></ruby> (5⭐)';
    const TEXT_BUY_40 = '<ruby>購<rt>ㄍㄡˋ</rt></ruby><ruby>買<rt>ㄇㄞˇ</rt></ruby> (40⭐)';

    const player = {
      x: 449, y: 988, targetX: 449, size: 400,
      minX: 265, maxX: 640, speedPxPerSec: 600,
      isMoving: false, isFacingLeft: false, walkCycle: 0
    };

    const bgImg = new Image();
    bgImg.src = 'assets/system/wardrobe.webp';

    const charImages = {
      han1: new Image(), han2: new Image(), han3: new Image(),
      han4: new Image(), han5: new Image(), han6: new Image(),
      chih1: new Image(), chih2: new Image()
    };
    charImages.han1.src = 'assets/player/han1-1.webp';
    charImages.han2.src = 'assets/player/han2-1.webp';
    charImages.han3.src = 'assets/player/han3-1.webp';
    charImages.han4.src = 'assets/player/han4-1.webp';
    charImages.han5.src = 'assets/player/han5-1.webp';
    charImages.han6.src = 'assets/player/han6-1.webp';
    charImages.chih1.src = 'assets/player/chih1-1.webp';
    charImages.chih2.src = 'assets/player/chih2-1.webp';

    let lastTime = performance.now();

    bgImg.onload = () => {
      canvas.width = bgImg.width;   
      canvas.height = bgImg.height; 
      document.getElementById('game-container').style.aspectRatio = `${bgImg.width} / ${bgImg.height}`;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    };

    function gameLoop(currentTime) {
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      update(Math.min(dt, 0.1));
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      if (player.isMoving) {
        let dx = player.targetX - player.x;
        let distance = Math.abs(dx);
        let moveDist = player.speedPxPerSec * dt;

        if (distance > moveDist) {
          player.x += Math.sign(dx) * moveDist;
          player.walkCycle += 25 * dt;
        } else {
          player.x = player.targetX;
          player.isMoving = false;
          player.walkCycle = 0;
        }
      }
    }

    function draw() {
      if (!canvas.width || !canvas.height) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (bgImg.complete) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      }

      const currentImg = charImages[equipped] || charImages.han1;
      if (currentImg && currentImg.complete) {
        ctx.save();
        let offsetY = player.isMoving ? Math.sin(player.walkCycle * 2) * 6 : 0;
        let rotationAngle = player.isMoving ? Math.sin(player.walkCycle) * 0.15 : 0;
        ctx.translate(player.x, player.y + offsetY);
        ctx.rotate(rotationAngle);
        if (player.isFacingLeft) ctx.scale(-1, 1);
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 12; ctx.shadowOffsetY = 8;
        ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);
        ctx.restore();
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
      if (clickY >= 750) {
        const clampedTargetX = Math.max(player.minX, Math.min(player.maxX, clickX));
        player.targetX = clampedTargetX;
        player.isFacingLeft = player.targetX < player.x;
        player.isMoving = true;
      }
    });

    function showBopoAlert(htmlWithRuby) {
      const modal = document.getElementById('customModal');
      document.getElementById('modalMessage').innerHTML = htmlWithRuby;
      if (window.Bopomofo && typeof window.Bopomofo.render === 'function') window.Bopomofo.render();
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function updateCardState(charKey, isEquipped, isOwned, costText) {
      const cards = document.querySelectorAll(`.char-card[data-char="${charKey}"]`);
      const btns = document.querySelectorAll(`button[data-btn="${charKey}"]`);
      
      cards.forEach(card => card.className = isEquipped ? 'char-card equipped' : 'char-card');
      
      btns.forEach(btn => {
        if (isOwned || charKey === 'han1') {
          btn.innerHTML = isEquipped ? TEXT_EQUIPPED : TEXT_EQUIP;
          btn.className = 'btn btn-equip';
          btn.style.backgroundColor = isEquipped ? '#4caf50' : '#2196f3';
        } else {
          btn.innerHTML = costText;
          btn.className = 'btn btn-buy';
          btn.style.backgroundColor = ''; 
        }
      });
    }

    function updateUI() {
      updateCardState('han1', equipped === 'han1', true, '');
      updateCardState('han2', equipped === 'han2', ownsHan2, TEXT_BUY_40);
      updateCardState('han3', equipped === 'han3', ownsHan3, TEXT_BUY_40);
      updateCardState('han4', equipped === 'han4', ownsHan4, TEXT_BUY_40);
      updateCardState('han5', equipped === 'han5', ownsHan5, TEXT_BUY_40);
      updateCardState('han6', equipped === 'han6', ownsHan6, TEXT_BUY_40);
      updateCardState('chih1', equipped === 'chih1', ownsChih1, TEXT_BUY_5);
      updateCardState('chih2', equipped === 'chih2', ownsChih2, TEXT_BUY_40);
      if (window.Bopomofo && typeof window.Bopomofo.render === 'function') window.Bopomofo.render();
    }

    function equipChar(charKey) {
      equipped = charKey;
      localStorage.setItem('equippedCharacter', charKey);
      updateUI();
    }

    function buyOrEquip(charKey, cost) {
      let ownsProp = 'owns_' + charKey;
      let owns = localStorage.getItem(ownsProp) === 'true';

      if (owns) {
        equipChar(charKey);
      } else {
        if (coins >= cost) {
          coins -= cost;
          localStorage.setItem('playerCoins', coins);
          localStorage.setItem(ownsProp, 'true');
          localStorage.setItem('sticker_s' + charKey, 'new'); 

          if (charKey === 'han2') ownsHan2 = true;
          if (charKey === 'han3') ownsHan3 = true;
          if (charKey === 'han4') ownsHan4 = true;
          if (charKey === 'han5') ownsHan5 = true;
          if (charKey === 'han6') ownsHan6 = true;
          if (charKey === 'chih1') ownsChih1 = true;
          if (charKey === 'chih2') ownsChih2 = true;

          document.getElementById('myCoins').innerText = coins;
          equipChar(charKey);
          showBopoAlert('<ruby>購<rt>ㄍㄡˋ</rt></ruby><ruby>買<rt>ㄇㄞˇ</rt></ruby><ruby>成<rt>ㄔㄥˊ</rt></ruby><ruby>功<rt>ㄍㄨㄥ</rt></ruby>🎉🎉🎉<br><span style="font-size: 24px; color: #facc15;">(獲得新貼紙！)</span>');
        } else {
          showBopoAlert('⭐ <ruby>不<rt>ㄅㄨˊ</rt></ruby><ruby>夠<rt>ㄍㄡˋ</rt></ruby><ruby>喔<rt>ㄛ</rt></ruby>');
        }
      }
    }

    // ==========================================
    // 真・無限迴圈 (Infinite Wheel) 核心邏輯
    // ==========================================
    const scrollContainer = document.getElementById('scrollContainer');
    let originalCardCount = 0;
    let cardWidthWithGap = 0;
    const SETS_TO_CLONE = 15; // 若未來增加角色,這邊可以改小一點

    function initInfiniteScroll() {
      const originalCards = Array.from(scrollContainer.children);
      originalCardCount = originalCards.length;
      if (originalCardCount === 0) return;

      const fragmentBefore = document.createDocumentFragment();
      const fragmentAfter = document.createDocumentFragment();

      // 1. 產生大量複製卡片
      for(let i = 0; i < SETS_TO_CLONE; i++) {
        originalCards.forEach(card => fragmentBefore.appendChild(card.cloneNode(true)));
        originalCards.forEach(card => fragmentAfter.appendChild(card.cloneNode(true)));
      }

      scrollContainer.insertBefore(fragmentBefore, scrollContainer.firstChild);
      scrollContainer.appendChild(fragmentAfter);

      updateUI();

      // 2. 算好距離並把畫面直接「置中」到最中間那一組本尊
      requestAnimationFrame(() => {
        const allCards = Array.from(scrollContainer.children);
        cardWidthWithGap = allCards[1].offsetLeft - allCards[0].offsetLeft;
        
        const centerStartIndex = SETS_TO_CLONE * originalCardCount;
        const centerFirstCard = allCards[centerStartIndex];
        
        const containerCenter = scrollContainer.clientWidth / 2;
        const cardCenter = centerFirstCard.offsetLeft + (centerFirstCard.offsetWidth / 2);
        
        scrollContainer.style.scrollSnapType = 'none';
        scrollContainer.scrollLeft = cardCenter - containerCenter;
        
        void scrollContainer.offsetHeight; // 強制重繪
        scrollContainer.style.scrollSnapType = 'x mandatory';
      });
    }

    // 3. 當滾動「完全停止」時（慣性結束），偷偷把畫面置中回最中間的那一組
    let scrollTimeout;
    scrollContainer.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        recenterSilently();
      }, 250); // 停止滑動 250 毫秒後觸發
    });

    function recenterSilently() {
      const allCards = Array.from(scrollContainer.children);
      const containerCenter = scrollContainer.scrollLeft + (scrollContainer.clientWidth / 2);
      
      let closestIndex = 0;
      let minDiff = Infinity;
      
      // 找出目前畫面上對齊的是哪一張卡
      allCards.forEach((card, index) => {
        const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
        const diff = Math.abs(containerCenter - cardCenter);
        if (diff < minDiff) {
          minDiff = diff;
          closestIndex = index;
        }
      });

      // 算出對應的是 1~7 的哪一個角色 (0~6)
      const charIndex = closestIndex % originalCardCount;
      // 算出最中間那組對應的卡片 index
      const targetIndex = (SETS_TO_CLONE * originalCardCount) + charIndex;
      
      // 如果目前偏離了最中間的那一組，就瞬間無縫跳轉過去
      if (closestIndex !== targetIndex) {
        const targetCard = allCards[targetIndex];
        const targetCardCenter = targetCard.offsetLeft + (targetCard.offsetWidth / 2);
        
        scrollContainer.style.scrollSnapType = 'none';
        scrollContainer.scrollLeft = targetCardCenter - (scrollContainer.clientWidth / 2);
        
        void scrollContainer.offsetHeight;
        scrollContainer.style.scrollSnapType = 'x mandatory';
      }
    }

    // 將按鈕綁定真正的寬度距離
    document.getElementById('leftArrow').addEventListener('click', () => {
       if (cardWidthWithGap) scrollContainer.scrollBy({ left: -cardWidthWithGap, behavior: 'smooth' });
    });
    
    document.getElementById('rightArrow').addEventListener('click', () => {
       if (cardWidthWithGap) scrollContainer.scrollBy({ left: cardWidthWithGap, behavior: 'smooth' });
    });

    window.addEventListener('load', initInfiniteScroll);

  </script>
</body>
</html>
